apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-demo-canary
  labels:
    release-role: canary
    release-version: v2
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: nodejs-demo.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-demo-stable
                port:
                  number: 80
