apiVersion: v1
kind: Service
metadata:
  name: nodejs-demo-stable
spec:
  selector:
    app: nodejs-demo
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-demo-canary
spec:
  selector:
    app: nodejs-demo
  ports:
    - port: 80
      targetPort: 3000
