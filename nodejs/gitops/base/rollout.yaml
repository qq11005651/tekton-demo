apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nodejs-demo
  labels:
    app: nodejs-demo
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: nodejs-demo
  template:
    metadata:
      labels:
        app: nodejs-demo
    spec:
      containers:
        - name: app
          image: hub.podcc.com/test/nodejs-demo:v1.0.0
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  strategy:
    canary:
      stableService: nodejs-demo-stable
      canaryService: nodejs-demo-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service
                value: nodejs-demo-canary
        - setWeight: 50
        - pause:
            duration: 3m
        - setWeight: 100
