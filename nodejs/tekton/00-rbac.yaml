apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodejs-ci-sa
  namespace: tekton-pipelines
secrets:
  - name: registry-auth
imagePullSecrets:
  - name: registry-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodejs-ci-role
  namespace: tekton-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodejs-ci-binding
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: nodejs-ci-sa
    namespace: tekton-pipelines
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodejs-ci-role
