---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: nginx-demo-gateway
  namespace: istio-system
  labels:
    app.kubernetes.io/managed-by: platform
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - nginx-demo.demo.local
